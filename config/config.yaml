# Filters can also be edited in the web UI at http://127.0.0.1:8765
telegram:
  parse_mode: HTML
  send_photos: true
  delay_seconds: 0.8
poll_interval_minutes: 30
best_count: 5
send_on_first_run: true
filters:
  - name: پراید اصفهان و حومه
    enabled: true
    category: light
    query: پراید
    cities:
      - اصفهان
      - خمینی‌شهر
      - نجف‌آباد
      - فلاورجان
    price_min_toman: 300000000
    price_max_toman: 450000000
    exclude_title:
      - تصادفی
      - چپی
      - اسقاط
      - موتور سوخته
      - یاتاقان
      - شاسی خورده
      - شاسی خوردگی
      - خوردگی شاسی
      - شاسی رنگ
      - رنگ شاسی
      - شاسی ضربه
      - ضربه شاسی
      - جوش شاسی
      - ستون خورده
      - پوسیدگی
      - زنگ زدگی
      - زنگ زده
    max_pages: 3
    id: 210837ed5c
