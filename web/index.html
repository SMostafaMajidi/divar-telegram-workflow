<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>فیلترهای دیوار</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">دیوار واچر</p>
      <h1>فیلتر آگهی‌ها</h1>
    </div>
    <div class="top-actions">
      <span id="telegram-pill" class="pill">تلگرام</span>
      <span id="watch-pill" class="pill">پایش خاموش</span>
      <button id="watch-btn" class="ghost" type="button">شروع پایش</button>
      <button id="run-btn" class="primary" type="button">ارسال به تلگرام</button>
    </div>
  </header>

  <main class="layout">
    <section class="panel filters-panel">
      <div class="panel-head">
        <h2>فیلترها</h2>
        <button id="add-btn" class="primary small" type="button">افزودن فیلتر</button>
      </div>
      <p class="hint">چند فیلتر جدا بساز؛ هر کدام شهر، قیمت و عبارت خودش را دارد.</p>
      <div id="filter-list" class="filter-list"></div>
      <form id="settings-form" class="settings">
        <h3>تنظیمات ارسال</h3>
        <label>فاصله پایش (دقیقه)
          <input name="poll_interval_minutes" type="number" min="1" step="1">
        </label>
        <label>حداکثر ارسال در هر دور
          <input name="max_send_per_run" type="number" min="1" max="80">
        </label>
        <label class="check">
          <input name="send_photos" type="checkbox">
          ارسال عکس آگهی
        </label>
        <label class="check">
          <input name="send_on_first_run" type="checkbox">
          در اجرای اول آگهی‌های فعلی هم بروند
        </label>
        <button type="submit" class="ghost small">ذخیره تنظیمات</button>
      </form>
      <div id="telegram-setup" class="telegram-setup" hidden>
        <h3>Chat ID تلگرام</h3>
        <p id="telegram-setup-hint" class="hint"></p>
        <button id="detect-chat-btn" class="primary small" type="button">خواندن Chat ID</button>
      </div>
    </section>

    <section class="panel results-panel">
      <div class="panel-head">
        <h2 id="results-title">نتایج</h2>
        <span id="results-meta" class="muted"></span>
      </div>
      <div id="toast" class="toast" hidden></div>
      <div id="results" class="results"></div>
    </section>
  </main>

  <dialog id="editor">
    <form id="filter-form" method="dialog">
      <header>
        <h2 id="editor-title">فیلتر جدید</h2>
        <button type="button" class="icon" id="close-editor" aria-label="بستن">×</button>
      </header>
      <input type="hidden" name="id">
      <label>نام فیلتر
        <input name="name" required placeholder="مثلاً پراید اصفهان">
      </label>
      <label>عبارت جستجو
        <input name="query" required placeholder="پراید">
      </label>
      <div class="field">
        <span>شهرها</span>
        <div id="city-chips" class="chips"></div>
        <input id="city-input" autocomplete="off" placeholder="جستجوی شهر، مثلاً اصفهان">
        <div id="city-suggest" class="suggest" hidden></div>
        <div id="city-popular" class="popular"></div>
      </div>
      <div class="row">
        <label>حداقل قیمت (میلیون تومان)
          <input name="price_min_million" type="number" min="0" step="1" placeholder="300">
        </label>
        <label>حداکثر قیمت (میلیون تومان)
          <input name="price_max_million" type="number" min="0" step="1" placeholder="450">
        </label>
      </div>
      <div class="field">
        <span>کلمات حذف از عنوان</span>
        <div id="exclude-chips" class="chips"></div>
        <input id="exclude-input" placeholder="مثلاً تصادفی و Enter">
      </div>
      <div class="row">
        <label>تعداد صفحات دیوار
          <input name="max_pages" type="number" min="1" max="8" value="3">
        </label>
        <label class="check end">
          <input name="enabled" type="checkbox" checked>
          فعال باشد
        </label>
      </div>
      <footer>
        <button type="button" id="preview-form-btn" class="ghost">پیش‌نمایش</button>
        <button type="submit" class="primary">ذخیره فیلتر</button>
      </footer>
    </form>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
