<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>قیمت‌ها — دیوار واچر</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=dark1">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">دیوار واچر</p>
      <h1>پلن‌ها</h1>
    </div>
    <div class="top-actions">
      <a class="ghost small" href="/">ورود مشتری</a>
      <a class="primary small" href="/">شروع آزمایشی</a>
    </div>
  </header>
  <main class="layout single">
    <section class="panel narrow-panel pricing-wrap">
      <p class="hint">آگهی مناسب، زودتر از بقیه، روی تلگرام. پرداخت فعلاً با هماهنگی پشتیبانی انجام می‌شود.</p>
      <div id="plans" class="pricing-grid"></div>
      <p class="meta">برای ارتقا یا تمدید، در ربات پیام بدهید یا با پشتیبانی هماهنگ کنید.</p>
    </section>
  </main>
  <script>
    const kinds = { trial: "آزمایشی", basic: "پایه", pro: "حرفه‌ای" };
    async function boot() {
      const res = await fetch("/api/plans");
      const data = await res.json();
      const root = document.getElementById("plans");
      for (const plan of data.plans || []) {
        const card = document.createElement("article");
        card.className = `pricing-card ${plan.id === "pro" ? "featured" : ""}`;
        card.innerHTML = `
          <p class="eyebrow">${plan.name}</p>
          <h2>${plan.price_label}</h2>
          <p class="meta">${plan.tagline || ""}</p>
          <ul class="pricing-features">${(plan.features || []).map((f) => `<li>${f}</li>`).join("")}</ul>
          <a class="primary small" href="/">${plan.id === "trial" ? "شروع رایگان" : "درخواست پلن"}</a>
        `;
        root.append(card);
      }
    }
    boot();
  </script>
</body>
</html>
