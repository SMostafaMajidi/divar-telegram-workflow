<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ادمین — دیوار واچر</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=dark4">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">ادمین</p>
      <h1>داشبورد</h1>
    </div>
    <div class="top-actions">
      <span id="watch-pill" class="pill">پایش خاموش</span>
      <button id="watch-btn" class="ghost" type="button">شروع پایش</button>
      <div class="nav-menu">
        <button type="button" class="ghost menu-trigger" aria-expanded="false" aria-haspopup="true">
          منو
          <span class="menu-caret" aria-hidden="true"></span>
        </button>
        <div class="menu-dropdown" hidden role="menu">
          <a class="menu-item" href="/admin/settings" role="menuitem">تنظیمات عمومی</a>
          <a class="menu-item" href="/pricing" role="menuitem">پلن‌ها</a>
          <hr class="menu-sep">
          <button id="logout-btn" class="menu-item danger" type="button" role="menuitem">خروج</button>
        </div>
      </div>
    </div>
  </header>
  <main class="layout single">
    <section class="panel">
      <p id="toast" class="toast" hidden></p>

      <div class="panel-head">
        <h2>مشتریان <span id="user-count" class="muted-count"></span></h2>
        <button id="toggle-create" class="primary small" type="button">افزودن مشتری</button>
      </div>

      <form id="create-form" class="create-box" hidden>
        <div class="create-grid">
          <label>یوزرنیم تلگرام
            <input name="telegram_username" required placeholder="بدون @">
          </label>
          <label>نام نمایشی
            <input name="display_name" placeholder="اختیاری">
          </label>
        </div>
        <div class="create-actions">
          <label class="check">
            <input name="ai_enabled" type="checkbox">
            هوش مصنوعی
          </label>
          <button class="primary small" type="submit">ساخت</button>
          <button id="cancel-create" class="ghost small" type="button">انصراف</button>
        </div>
      </form>

      <div id="user-list" class="user-summary-list"></div>
    </section>
  </main>
  <script src="/dates.js?v=1"></script>
  <script src="/admin-common.js?v=2"></script>
  <script src="/admin.js?v=8"></script>
</body>
</html>
